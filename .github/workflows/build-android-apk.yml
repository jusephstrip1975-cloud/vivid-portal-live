name: Build Android APK

# Compila el APK de AETHERX automáticamente y lo publica como Release
# de GitHub para que el botón "Descargar Android" en aetherx.org pueda
# servirlo.
#
# Se dispara en cada push a main y también manualmente desde la pestaña
# Actions → Build Android APK → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Grant gradlew permissions
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/aetherx-latest.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherx-latest-apk
          path: dist-apk/aetherx-latest.apk

      - name: Publish / update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AETHERX latest APK
          body: |
            APK debug generado automáticamente desde el último commit en main.
            Descarga directa: aetherx-latest.apk
          files: dist-apk/aetherx-latest.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

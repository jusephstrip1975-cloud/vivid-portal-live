name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Uses the Android SDK preinstalled on the GitHub runner (setup-android action broke in Oct 2026).
      - name: Setup Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          echo "sdk.dir=$SDK" > android/local.properties
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor Android project
        run: bun run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # FFmpegKit removed — RAW wallpaper plays directly via MediaPlayer, no transcode.

      - name: Decode release keystore (outside repo)
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AETHERX_KEYSTORE_PASSWORD: ${{ secrets.AETHERX_KEYSTORE_PASSWORD }}
          AETHERX_KEY_ALIAS: ${{ secrets.AETHERX_KEY_ALIAS }}
          AETHERX_KEY_PASSWORD: ${{ secrets.AETHERX_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$AETHERX_KEYSTORE_PASSWORD" ] && [ -n "$AETHERX_KEY_ALIAS" ] && [ -n "$AETHERX_KEY_PASSWORD" ]; then
            KS="$RUNNER_TEMP/aetherx-release.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "AETHERX_KEYSTORE_PATH=$KS"
              echo "AETHERX_KEYSTORE_PASSWORD=$AETHERX_KEYSTORE_PASSWORD"
              echo "AETHERX_KEY_ALIAS=$AETHERX_KEY_ALIAS"
              echo "AETHERX_KEY_PASSWORD=$AETHERX_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets missing: release will be unsigned and not published."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release AAB + APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew clean bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log
          exit ${PIPESTATUS[0]}

      - name: Print build failure report
        if: failure()
        run: |
          grep -nE "FAILURE:|What went wrong|Caused by|Execution failed|error:" /tmp/gradle-release.log | head -200 || true
          tail -n 200 /tmp/gradle-release.log || true

      - name: Locate release outputs
        id: outputs
        shell: bash
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          ls -la android/app/build/outputs/apk/release/ android/app/build/outputs/bundle/release/

      - name: Upload release AAB + APK (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-release
          path: |
            ${{ steps.outputs.outputs.apk }}
            ${{ steps.outputs.outputs.aab }}
          if-no-files-found: error

      - name: Verify APK signature
        id: verify
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify --print-certs "${{ steps.outputs.outputs.apk }}"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK for public release
        if: steps.verify.outputs.signed == 'true'
        run: |
          mkdir -p dist-apk
          cp "${{ steps.outputs.outputs.apk }}" dist-apk/aetherx-latest.apk

      - name: Publish / update "latest" GitHub Release
        if: steps.verify.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AETHERX latest APK
          body: |
            APK release firmado, generado automáticamente desde el último commit en main.
            Descarga directa: aetherx-latest.apk
          files: dist-apk/aetherx-latest.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build AETHERX Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set unique build version
        run: echo "AETHERX_BUILD_VERSION=$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Total clean before install
        run: |
          rm -rf android/.gradle android/app/build android/build node_modules/.cache public/dist dist .capacitor android/app/src/main/assets/public
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper/dists
          echo "TOTAL_ANDROID_CLEAN_OK"

      - name: Delete previous AETHERX artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | startswith("AETHERX")) | .id' \
            | while read -r artifact_id; do
                if [ -n "$artifact_id" ]; then
                  gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$artifact_id
                  echo "Deleted previous AETHERX artifact id=$artifact_id"
                fi
              done

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Regenerate Capacitor local assets
        run: npm run build:capacitor

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android wiring and fresh assets
        run: |
          node scripts/lock-android-local-final.mjs
          node scripts/verify-capacitor-assets.mjs

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----- Signing setup -----
      # If release signing secrets exist, use them. If not, generate an internal
      # temporary keystore so the workflow still produces installable release APK/AAB.
      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using provided release keystore from secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "ks_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            KS=android/app/release.keystore
            KS_PASS=aetherx-internal-test
            KEY_PASS=aetherx-internal-test
            ALIAS=aetherx-test
            if [ -f "$KS" ]; then
              echo "Existing keystore found at $KS"
              if keytool -list -keystore "$KS" -alias "$ALIAS" -storepass "$KS_PASS" >/dev/null 2>&1; then
                echo "Alias '$ALIAS' already exists in keystore. Reusing as-is."
              else
                echo "Keystore exists but alias '$ALIAS' missing. Adding alias."
                keytool -genkeypair -v \
                  -keystore "$KS" \
                  -storepass "$KS_PASS" \
                  -keypass "$KEY_PASS" \
                  -alias "$ALIAS" \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=AETHERX Internal Test, OU=AETHERX, O=AETHERX, L=Local, S=Local, C=ES"
              fi
            else
              echo "No keystore found. Generating new temporary internal keystore."
              keytool -genkeypair -v \
                -keystore "$KS" \
                -storepass "$KS_PASS" \
                -keypass "$KEY_PASS" \
                -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=AETHERX Internal Test, OU=AETHERX, O=AETHERX, L=Local, S=Local, C=ES"
            fi
            echo "ks_password=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=$ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASS" >> "$GITHUB_OUTPUT"
          fi
          echo "Keystore size: $(stat -c%s android/app/release.keystore) bytes"

      - name: Stop Gradle and purge project outputs
        working-directory: android
        run: |
          ./gradlew --stop || true
          ./gradlew clean cleanBuildCache --no-daemon --no-build-cache --rerun-tasks --stacktrace

      # ----- RELEASE APK + AAB (signed, minified, shrunk, no cache) -----
      - name: Build release APK and AAB
        working-directory: android
        env:
          AETHERX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          AETHERX_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ks_password }}
          AETHERX_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          AETHERX_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHERX-${{ env.AETHERX_BUILD_VERSION }}-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: AETHERX-${{ env.AETHERX_BUILD_VERSION }}-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

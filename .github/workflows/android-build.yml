name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor Android project
        run: bun run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fetch vendored FFmpegKit AAR (retired from Maven)
        run: bash scripts/fetch-ffmpegkit.sh

      # ----- RELEASE APK (signed with committed stable keystore) -----
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: List release APK output
        run: ls -la android/app/build/outputs/apk/release/

      - name: Verify native libs inside APK
        run: |
          APK=android/app/build/outputs/apk/release/AetherX-release-signed.apk
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/" | head -40 || echo "WARNING: no native libs found"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-release-signed
          path: android/app/build/outputs/apk/release/AetherX-release-signed.apk
          if-no-files-found: error

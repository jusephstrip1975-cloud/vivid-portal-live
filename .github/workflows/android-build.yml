name: Build AETHERX Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor Android project
        run: bun run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ----- Signing setup -----
      # Release builds must use a real stable keystore. Test keystores are blocked
      # because they make the APK look like an internal/prototype build.
      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "Using provided release keystore from secrets."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ks_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "Keystore size: $(stat -c%s android/app/release.keystore) bytes"

      # ----- RELEASE APK (signed, minified, shrunk) -----
      - name: Build release APK
        working-directory: android
        env:
          AETHERX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          AETHERX_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ks_password }}
          AETHERX_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          AETHERX_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHERX-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ----- AAB (Google Play upload format) -----
      - name: Build release AAB
        working-directory: android
        env:
          AETHERX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          AETHERX_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ks_password }}
          AETHERX_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          AETHERX_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: AETHERX-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

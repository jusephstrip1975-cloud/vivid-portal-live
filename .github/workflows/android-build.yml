name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor Android project
        run: bun run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # FFmpegKit removed — RAW wallpaper plays directly via MediaPlayer, no transcode.

      # ----- DEBUG APK (idéntico al que funciona por USB, firmado con la misma keystore estable) -----
      - name: Build signed debug APK (full diagnostics)
        working-directory: android
        shell: bash
        run: |
          set -x
          rm -rf .gradle app/build
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all 2>&1 | tee /tmp/gradle-debug.log
          STATUS=${PIPESTATUS[0]}
          echo "===== GRADLE EXIT STATUS: $STATUS ====="
          exit $STATUS

      - name: Print build failure report (always)
        if: always()
        shell: bash
        run: |
          echo "===== KEY FAILURE LINES ====="
          grep -nE "FAILURE:|What went wrong|Caused by|Execution failed|error:|\.java:[0-9]+:" /tmp/gradle-debug.log | head -200 || true
          echo "===== last 200 lines of gradle log ====="
          tail -n 200 /tmp/gradle-debug.log || true

      - name: Upload full gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-log
          path: /tmp/gradle-debug.log
          if-no-files-found: warn

      - name: List debug APK output
        if: success()
        run: ls -la android/app/build/outputs/apk/debug/

      - name: Verify native libs inside APK
        run: |
          APK=android/app/build/outputs/apk/debug/AetherX-release-signed-debug.apk
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/" | head -40 || echo "WARNING: no native libs found"

      - name: Upload signed debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-debug-signed
          path: android/app/build/outputs/apk/debug/AetherX-release-signed-debug.apk
          if-no-files-found: error

      - name: Prepare APK for public release
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/AetherX-release-signed-debug.apk dist-apk/aetherx-latest.apk

      - name: Publish / update "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AETHERX latest APK
          body: |
            APK release firmado, generado automáticamente desde el último commit en main.
            Descarga directa: aetherx-latest.apk
          files: dist-apk/aetherx-latest.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build local Capacitor Android project
        run: bun run build:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # FFmpegKit removed — RAW wallpaper plays directly via MediaPlayer, no transcode.

      # ----- RELEASE APK (signed with committed stable keystore) -----
      - name: Build signed release APK (full diagnostics)
        working-directory: android
        shell: bash
        run: |
          set -x
          rm -rf .gradle app/build
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all 2>&1 | tee /tmp/gradle-release.log
          STATUS=${PIPESTATUS[0]}
          echo "===== GRADLE EXIT STATUS: $STATUS ====="
          exit $STATUS

      - name: Print build failure report (always)
        if: always()
        shell: bash
        run: |
          echo "===== KEY FAILURE LINES ====="
          grep -nE "FAILURE:|What went wrong|Caused by|Execution failed|error:|\.java:[0-9]+:" /tmp/gradle-release.log | head -200 || true
          echo "===== problems-report.html (text) ====="
          for f in android/app/build/reports/problems/problems-report.html android/build/reports/problems/problems-report.html; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              { sed 's/<[^>]*>/ /g' "$f" | tr -s ' \n' | head -n 300; } 2>/dev/null || true
            fi
          done
          echo "===== last 200 lines of gradle log ====="
          tail -n 200 /tmp/gradle-release.log || true

      - name: Upload full gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-log
          path: /tmp/gradle-release.log
          if-no-files-found: warn

      - name: List release APK output
        if: success()
        run: ls -la android/app/build/outputs/apk/release/

      - name: Verify native libs inside APK
        run: |
          APK=android/app/build/outputs/apk/release/AetherX-release-signed.apk
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/" | head -40 || echo "WARNING: no native libs found"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-release-signed
          path: android/app/build/outputs/apk/release/AetherX-release-signed.apk
          if-no-files-found: error

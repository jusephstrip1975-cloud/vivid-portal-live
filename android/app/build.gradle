apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.wallpapers"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aetherx.wallpapers"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyAetherXLocalCapacitorAssets') {
    doLast {
        def assetsDir = file("$projectDir/src/main/assets")
        def indexFile = file("$projectDir/src/main/assets/public/index.html")
        def configFile = file("$projectDir/src/main/assets/capacitor.config.json")

        if (!assetsDir.exists()) {
            throw new GradleException('Missing android/app/src/main/assets. Run: bun run build && npx cap sync android')
        }
        if (!indexFile.exists()) {
            throw new GradleException('Missing android/app/src/main/assets/public/index.html. Run: bun run build && npx cap sync android')
        }
        if (!configFile.exists()) {
            throw new GradleException('Missing android/app/src/main/assets/capacitor.config.json. Run: bun run build && npx cap sync android')
        }

        def indexText = indexFile.getText('UTF-8')
        def configText = configFile.getText('UTF-8')

        if (configText.contains('"server"') || configText.contains('aetherx.org') || configText.contains('server.url')) {
            throw new GradleException('Forbidden remote Capacitor startup config found. capacitor.config.json must not contain server.url or aetherx.org')
        }
        if (!configText.contains('"webDir"') || !configText.contains('"public/dist"')) {
            throw new GradleException('Unexpected Capacitor config. Expected webDir public/dist from capacitor.config.ts before sync')
        }
        if (indexText.contains('https://aetherx.org') || indexText.contains('loadUrl(') || indexText.contains('Browser.open') || indexText.contains('window.open')) {
            throw new GradleException('Forbidden external startup reference found in local index.html')
        }
        if (!indexText.contains('src="./assets/') || !indexText.contains('href="./assets/')) {
            throw new GradleException('Local index.html must use relative ./assets references for APK startup')
        }
        if (!indexText.contains('aetherx-native-fallback')) {
            throw new GradleException('Local index.html is missing the native boot fallback; Android would show black if JS fails')
        }
        if (!indexText.contains('AetherX cargando local') || !indexText.contains('window.onerror')) {
            throw new GradleException('Local index.html must show visible boot diagnostics and capture JS startup errors')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLocalCapacitorAssets'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

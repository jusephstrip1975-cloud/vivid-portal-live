apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.livewallpaper"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Final installable identity: name + package shown by Android + Play Protect.
        applicationId "com.aetherx.livewallpaper"
        setProperty("archivesBaseName", "AetherX-release-signed")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 301
        versionName "3.0.1-buildfix"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    splits {
        abi { enable false }
        density { enable false }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so'
            ]
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    // Stable release signing config — committed keystore ensures the signature
    // never changes between builds, which is what Play Protect uses to learn
    // the developer identity over time.
    signingConfigs {
        release {
            storeFile file('aetherx-release.keystore')
            storePassword 'aetherx2026'
            keyAlias 'aetherx'
            keyPassword 'aetherx2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            // Sign debug builds with the release key as well so installing a
            // debug build doesn't clash with a release build on the same device.
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set('AetherX-release-signed.apk')
        }
    }
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set('AetherX-release-signed-debug.apk')
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"

    implementation files('libs/ffmpeg-kit-min-6.0-2.aar')
    implementation files('libs/smart-exception-java-0.2.1.jar')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyAetherXLiveWallpaperSetup') {
    doLast {
        def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText('UTF-8')
        if (!manifest.contains('com.aetherx.livewallpaper.wallpaper.AetherXLiveWallpaperService')) {
            throw new GradleException('AetherXLiveWallpaperService must be declared in AndroidManifest.xml')
        }
        if (!manifest.contains('android.permission.BIND_WALLPAPER')) {
            throw new GradleException('Live wallpaper service must be guarded by BIND_WALLPAPER permission')
        }
        if (!manifest.contains('android.service.wallpaper.WallpaperService')) {
            throw new GradleException('Live wallpaper service must declare WallpaperService intent-filter')
        }
        def keystore = file("$projectDir/aetherx-release.keystore")
        if (!keystore.exists()) {
            throw new GradleException('Missing aetherx-release.keystore — release signature would not be stable')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLiveWallpaperSetup'
}

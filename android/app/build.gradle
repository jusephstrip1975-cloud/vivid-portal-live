apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.localfinal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aetherx.localfinal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "1.0-local-final"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set('app-aetherx-localfinal-debug.apk')
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

tasks.register('verifyAetherXNativeLocalFinal') {
    doLast {
        def mainActivityFile = file("$projectDir/src/main/java/com/aetherx/localfinal/MainActivity.java")
        def manifestFile = file("$projectDir/src/main/AndroidManifest.xml")
        def stringsFile = file("$projectDir/src/main/res/values/strings.xml")
        def pluginsFile = file("$projectDir/src/main/assets/capacitor.plugins.json")
        def configFile = file("$projectDir/src/main/assets/capacitor.config.json")

        if (!mainActivityFile.exists()) {
            throw new GradleException('Missing native local-final MainActivity.java')
        }
        if (!manifestFile.exists()) {
            throw new GradleException('Missing android/app/src/main/AndroidManifest.xml')
        }

        def mainActivityText = mainActivityFile.getText('UTF-8')
        def manifestText = manifestFile.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
        def stringsText = stringsFile.exists() ? stringsFile.getText('UTF-8') : ''
        def pluginsText = pluginsFile.exists() ? pluginsFile.getText('UTF-8') : ''
        def configText = configFile.exists() ? configFile.getText('UTF-8') : ''

        def countMatches = { String text, String pattern ->
            def matcher = text =~ pattern
            def count = 0
            while (matcher.find()) { count++ }
            return count
        }

        if (!mainActivityText.contains('package com.aetherx.localfinal;')) {
            throw new GradleException('MainActivity must use package com.aetherx.localfinal')
        }
        if (!mainActivityText.contains('AETHERX APP LOCAL FUNCIONANDO')) {
            throw new GradleException('MainActivity must render AETHERX APP LOCAL FUNCIONANDO')
        }
        if (stringsText.contains('AetherX Local Final') == false || stringsText.contains('com.aetherx.localfinal') == false) {
            throw new GradleException('strings.xml must identify AetherX Local Final and com.aetherx.localfinal')
        }
        def oldDomain = ['aetherx', 'org'].join('.')
        def oldPackage = ['com', 'aetherx', 'wallpapers'].join('.')
        if (configText.contains('server') || configText.contains(oldDomain) || configText.contains(oldPackage)) {
            throw new GradleException('Capacitor config assets must not contain server config, aetherx.org, or the old package id')
        }
        if (countMatches(manifestText, /<activity\b/) != 1) {
            throw new GradleException('AndroidManifest.xml must declare exactly one Activity: com.aetherx.localfinal.MainActivity')
        }
        if ((manifestText =~ /<activity\-alias\b/).find()) {
            throw new GradleException('AndroidManifest.xml must not declare secondary activity entries')
        }
        if (!manifestText.contains('android:name="com.aetherx.localfinal.MainActivity"')) {
            throw new GradleException('MainActivity must be declared with the new fully-qualified class name')
        }
        def mainActivityBlockMatcher = manifestText =~ /(?s)<activity\b(?=[^>]*android:name="com\.aetherx\.localfinal\.MainActivity")[\s\S]*?<\/activity>/
        if (!mainActivityBlockMatcher.find()) {
            throw new GradleException('MainActivity declaration was not found in AndroidManifest.xml')
        }
        def mainActivityBlock = mainActivityBlockMatcher.group(0)
        if (!mainActivityBlock.contains('android.intent.action.MAIN') || !mainActivityBlock.contains('android.intent.category.LAUNCHER')) {
            throw new GradleException('MainActivity must be the only MAIN/LAUNCHER entry point')
        }
        if (countMatches(manifestText, /android\.intent\.action\.MAIN/) != 1 || countMatches(manifestText, /android\.intent\.category\.LAUNCHER/) != 1) {
            throw new GradleException('AndroidManifest.xml must contain exactly one MAIN action and exactly one LAUNCHER category')
        }
        def forbiddenTokens = [
            'android.intent.action.' + 'VIEW',
            'android.intent.category.' + 'BROWSABLE',
            'android:scheme=',
            'android:host=',
            'android:autoVerify=',
            oldDomain,
            oldPackage,
            'Browser' + '.open',
            'Browser' + 'Plugin',
            '@capacitor/' + 'browser',
            'Custom' + 'Tabs' + 'Intent',
            'Intent.' + 'ACTION' + '_VIEW',
            'ACTION' + '_VIEW',
            'start' + 'Activity(',
            'start' + 'Activity' + 'ForResult(',
            'Web' + 'View',
            'Bridge' + 'Activity',
            'Capacitor',
            'load' + 'Url('
        ]
        forbiddenTokens.each { forbidden ->
            if (manifestText.contains(forbidden)) throw new GradleException("Forbidden manifest token found: ${forbidden}")
            if (mainActivityText.contains(forbidden)) throw new GradleException("Forbidden MainActivity token found: ${forbidden}")
            if (pluginsText.contains(forbidden)) throw new GradleException("Forbidden Capacitor plugin token found: ${forbidden}")
            if (configText.contains(forbidden)) throw new GradleException("Forbidden Capacitor config token found: ${forbidden}")
        }
        if ((manifestText =~ /android:scheme\s*=/).find() || (manifestText =~ /android:host\s*=/).find() || (manifestText =~ /android:autoVerify\s*=/).find()) {
            throw new GradleException('AndroidManifest.xml must not declare URL schemes, hosts, app links, or deep links')
        }
        if (pluginsText.trim() != '[]') {
            throw new GradleException('capacitor.plugins.json must be an empty array for this native local-final APK')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXNativeLocalFinal'
}

tasks.register('verifyAetherXMergedManifest') {
    doLast {
        def manifestRoots = [
            file("$buildDir/intermediates/merged_manifest"),
            file("$buildDir/intermediates/merged_manifests"),
            file("$buildDir/intermediates/packaged_manifests")
        ]
        def manifests = []
        manifestRoots.each { root ->
            if (root.exists()) {
                root.eachFileRecurse { candidate ->
                    if (candidate.name == 'AndroidManifest.xml') manifests << candidate
                }
            }
        }

        if (manifests.isEmpty()) {
            logger.lifecycle('No merged AndroidManifest.xml found yet; source manifest guard already passed.')
            return
        }

        def countMatches = { String text, String pattern ->
            def matcher = text =~ pattern
            def count = 0
            while (matcher.find()) { count++ }
            return count
        }

        manifests.each { manifest ->
            def text = manifest.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
            if (countMatches(text, /<activity\b/) != 1) {
                throw new GradleException("Merged manifest ${manifest} must declare exactly one Activity")
            }
            if ((text =~ /<activity\-alias\b/).find()) {
                throw new GradleException("Merged manifest ${manifest} must not declare secondary activity entries")
            }
            if (!text.contains('android:name="com.aetherx.localfinal.MainActivity"')) {
                throw new GradleException("Merged manifest ${manifest} must keep MainActivity as the single Activity")
            }
            if (countMatches(text, /android\.intent\.action\.MAIN/) != 1 || countMatches(text, /android\.intent\.category\.LAUNCHER/) != 1) {
                throw new GradleException("Merged manifest ${manifest} must contain exactly one MAIN action and exactly one LAUNCHER category")
            }
            ['android.intent.action.' + 'VIEW', 'android.intent.category.' + 'BROWSABLE'].each { forbidden ->
                if (text.contains(forbidden)) {
                    throw new GradleException("Forbidden deep-link/browser entry found in merged manifest ${manifest}: ${forbidden}")
                }
            }
            if ((text =~ /android:scheme\s*=/).find() || (text =~ /android:host\s*=/).find() || (text =~ /android:autoVerify\s*=/).find()) {
                throw new GradleException("Merged manifest ${manifest} must not contain URL schemes, hosts, app links, or deep links")
            }
            def oldDomain = ['aetherx', 'org'].join('.')
            def oldPackage = ['com', 'aetherx', 'wallpapers'].join('.')
            if (text.contains(oldPackage) || text.contains(oldDomain)) {
                throw new GradleException("Merged manifest ${manifest} must not contain old package id or aetherx.org")
            }
        }
    }
}

tasks.register('verifyAetherXFinalDebugApk') {
    doLast {
        def expected = file("$buildDir/outputs/apk/debug/app-aetherx-localfinal-debug.apk")
        if (!expected.exists()) {
            throw new GradleException("Expected debug APK was not generated: ${expected}")
        }
        logger.lifecycle("AetherX Local Final debug APK generated: ${expected}")
    }
}

tasks.register('copyDebugApk') {
    doLast {
        def debugOutputDir = file("$buildDir/outputs/apk/debug")
        def source = file("${debugOutputDir}/app-debug.apk")
        def target = file("${debugOutputDir}/app-aetherx-localfinal-debug.apk")

        if (!source.exists() && target.exists()) {
            logger.lifecycle("AetherX Local Final APK already exists: ${target}")
            return
        }

        if (!source.exists()) {
            throw new GradleException("Cannot copy debug APK because app-debug.apk was not found in ${debugOutputDir}")
        }

        debugOutputDir.mkdirs()
        target.bytes = source.bytes

        if (!target.exists()) {
            throw new GradleException("Failed to create final debug APK: ${target}")
        }

        logger.lifecycle("Copied ${source.name} to ${target.name}")
    }
}

afterEvaluate {
    tasks.matching { task -> task.name ==~ /process.*MainManifest/ }.configureEach {
        finalizedBy tasks.named('verifyAetherXMergedManifest')
    }
    tasks.matching { task -> task.name == 'assembleDebug' }.configureEach {
        finalizedBy tasks.named('copyDebugApk')
    }
    tasks.named('copyDebugApk') {
        finalizedBy tasks.named('verifyAetherXFinalDebugApk')
    }
}

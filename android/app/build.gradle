apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.wallpapers"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aetherx.wallpapers"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'debug') {
                outputFileName = 'app-aetherx-local-final-debug.apk'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyAetherXLocalCapacitorAssets') {
    doLast {
        def assetsDir = file("$projectDir/src/main/assets")
        def indexFile = file("$projectDir/src/main/assets/public/index.html")
        def configFile = file("$projectDir/src/main/assets/capacitor.config.json")
        def mainActivityFile = file("$projectDir/src/main/java/com/aetherx/wallpapers/MainActivity.java")
        def manifestFile = file("$projectDir/src/main/AndroidManifest.xml")
        def cordovaConfigFile = file("$projectDir/src/main/res/xml/config.xml")
        def pluginsFile = file("$projectDir/src/main/assets/capacitor.plugins.json")
        def packageFile = file("$rootDir/../package.json")
        def liveWallpaperPluginFile = file("$rootDir/../plugins/aetherx-live-wallpaper/android/src/main/java/com/aetherx/livewallpaper/AetherXLiveWallpaperPlugin.java")

        if (!assetsDir.exists()) {
            throw new GradleException('Missing android/app/src/main/assets. Run: bun run build && npx cap sync android')
        }
        if (!indexFile.exists()) {
            throw new GradleException('Missing android/app/src/main/assets/public/index.html. Run: bun run build && npx cap sync android')
        }
        if (!configFile.exists()) {
            throw new GradleException('Missing android/app/src/main/assets/capacitor.config.json. Run: bun run build && npx cap sync android')
        }
        if (!mainActivityFile.exists()) {
            throw new GradleException('Missing real android/app MainActivity.java')
        }
        if (!manifestFile.exists()) {
            throw new GradleException('Missing android/app/src/main/AndroidManifest.xml')
        }

        def indexText = indexFile.getText('UTF-8')
        def configText = configFile.getText('UTF-8')
        def mainActivityText = mainActivityFile.getText('UTF-8')
        def manifestText = manifestFile.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
        def cordovaConfigText = cordovaConfigFile.exists() ? cordovaConfigFile.getText('UTF-8') : ''
        def pluginsText = pluginsFile.exists() ? pluginsFile.getText('UTF-8') : ''
        def packageText = packageFile.exists() ? packageFile.getText('UTF-8') : ''
        def liveWallpaperPluginText = liveWallpaperPluginFile.exists() ? liveWallpaperPluginFile.getText('UTF-8') : ''

        def countMatches = { String text, String pattern ->
            def matcher = text =~ pattern
            def count = 0
            while (matcher.find()) { count++ }
            return count
        }

        if (configText.contains('"server"') || configText.contains('aetherx.org') || configText.contains('server.url')) {
            throw new GradleException('Forbidden remote Capacitor startup config found. capacitor.config.json must not contain server.url or aetherx.org')
        }
        if (!configText.contains('"webDir"') || !configText.contains('"public/dist"')) {
            throw new GradleException('Unexpected Capacitor config. Expected webDir public/dist from capacitor.config.ts before sync')
        }
        if (indexText.contains('https://aetherx.org') || indexText.contains('loadUrl(') || indexText.contains('Browser.open') || indexText.contains('window.open') || indexText.contains('location.href') || indexText.contains('location.replace') || indexText.contains('target="_blank"') || indexText.contains("target='_blank'")) {
            throw new GradleException('Forbidden external startup reference found in local index.html')
        }
        if (!indexText.contains('src="./assets/') || !indexText.contains('href="./assets/')) {
            throw new GradleException('Local index.html must use relative ./assets references for APK startup')
        }
        if (!indexText.contains('aetherx-native-fallback')) {
            throw new GradleException('Local index.html is missing the native boot fallback; Android would show black if JS fails')
        }
        if (!indexText.contains('AetherX cargando local') || !indexText.contains('window.onerror')) {
            throw new GradleException('Local index.html must show visible boot diagnostics and capture JS startup errors')
        }
        if (!indexText.contains('APP LOCAL AETHERX VERSION FINAL')) {
            throw new GradleException('Local index.html must show APP LOCAL AETHERX VERSION FINAL on first screen')
        }
        if (!mainActivityText.contains('new ServerPath(ServerPath.PathType.ASSET_PATH, "public")')) {
            throw new GradleException('MainActivity must force Capacitor to serve android/app/src/main/assets/public before first WebView load')
        }
        if (mainActivityText.contains('ACTION_VIEW') || mainActivityText.contains('loadUrl("http') || mainActivityText.contains('Intent.ACTION_VIEW, Uri.parse') || mainActivityText.contains('Browser.open') || mainActivityText.contains('CustomTabsIntent') || mainActivityText.contains('startActivity(') || mainActivityText.contains('startActivityForResult(')) {
            throw new GradleException('MainActivity contains a forbidden external browser or remote load path')
        }
        if (liveWallpaperPluginText.contains('ACTION_VIEW') || liveWallpaperPluginText.contains('Intent.ACTION_VIEW') || liveWallpaperPluginText.contains('Browser.open') || liveWallpaperPluginText.contains('CustomTabsIntent') || liveWallpaperPluginText.contains('startActivity(') || liveWallpaperPluginText.contains('startActivityForResult(')) {
            throw new GradleException('Live wallpaper plugin contains a forbidden Activity/browser launch path')
        }
        if (countMatches(manifestText, /<activity\b/) != 1) {
            throw new GradleException('AndroidManifest.xml must declare exactly one Activity: com.aetherx.wallpapers.MainActivity')
        }
        if ((manifestText =~ /<activity-alias\b/).find()) {
            throw new GradleException('AndroidManifest.xml must not declare activity-alias entries')
        }
        if (!manifestText.contains('android:name="com.aetherx.wallpapers.MainActivity"')) {
            throw new GradleException('MainActivity must be declared with the fully-qualified class name')
        }
        def mainActivityBlockMatcher = manifestText =~ /(?s)<activity\b(?=[^>]*android:name="com\.aetherx\.wallpapers\.MainActivity")[\s\S]*?<\/activity>/
        if (!mainActivityBlockMatcher.find()) {
            throw new GradleException('MainActivity declaration was not found in AndroidManifest.xml')
        }
        def mainActivityBlock = mainActivityBlockMatcher.group(0)
        if (!mainActivityBlock.contains('android.intent.action.MAIN') || !mainActivityBlock.contains('android.intent.category.LAUNCHER')) {
            throw new GradleException('MainActivity must be the only MAIN/LAUNCHER entry point')
        }
        if (countMatches(manifestText, /android\.intent\.action\.MAIN/) != 1 || countMatches(manifestText, /android\.intent\.category\.LAUNCHER/) != 1) {
            throw new GradleException('AndroidManifest.xml must contain exactly one MAIN action and exactly one LAUNCHER category')
        }
        ['android.intent.action.VIEW', 'android.intent.category.BROWSABLE'].each { forbidden ->
            if (manifestText.contains(forbidden)) {
                throw new GradleException("Forbidden deep-link/browser manifest entry found: ${forbidden}")
            }
        }
        if ((manifestText =~ /android:scheme\s*=/).find() || (manifestText =~ /android:host\s*=/).find() || (manifestText =~ /android:autoVerify\s*=/).find()) {
            throw new GradleException('AndroidManifest.xml must not declare URL schemes, hosts, app links, or deep links')
        }
        if (cordovaConfigText.contains('<allow-intent') || cordovaConfigText.contains('<allow-navigation')) {
            throw new GradleException('Cordova config.xml must not contain allow-intent or allow-navigation entries')
        }
        if (cordovaConfigText.contains('<access')) {
            throw new GradleException('Cordova config.xml must not contain broad <access> entries')
        }
        if (pluginsText.toLowerCase().contains('browser') || packageText.contains('@capacitor/browser')) {
            throw new GradleException('Capacitor Browser plugin is forbidden in this APK')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLocalCapacitorAssets'
}

tasks.register('verifyAetherXMergedManifest') {
    doLast {
        def manifestRoots = [
            file("$buildDir/intermediates/merged_manifest"),
            file("$buildDir/intermediates/merged_manifests"),
            file("$buildDir/intermediates/packaged_manifests")
        ]
        def manifests = []
        manifestRoots.each { root ->
            if (root.exists()) {
                root.eachFileRecurse { candidate ->
                    if (candidate.name == 'AndroidManifest.xml') manifests << candidate
                }
            }
        }

        if (manifests.isEmpty()) {
            logger.lifecycle('No merged AndroidManifest.xml found yet; source manifest guard already passed.')
            return
        }

        def countMatches = { String text, String pattern ->
            def matcher = text =~ pattern
            def count = 0
            while (matcher.find()) { count++ }
            return count
        }

        manifests.each { manifest ->
            def text = manifest.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
            if (countMatches(text, /<activity\b/) != 1) {
                throw new GradleException("Merged manifest ${manifest} must declare exactly one Activity")
            }
            if ((text =~ /<activity-alias\b/).find()) {
                throw new GradleException("Merged manifest ${manifest} must not declare activity-alias entries")
            }
            if (!text.contains('android:name="com.aetherx.wallpapers.MainActivity"')) {
                throw new GradleException("Merged manifest ${manifest} must keep MainActivity as the single Activity")
            }
            if (countMatches(text, /android\.intent\.action\.MAIN/) != 1 || countMatches(text, /android\.intent\.category\.LAUNCHER/) != 1) {
                throw new GradleException("Merged manifest ${manifest} must contain exactly one MAIN action and exactly one LAUNCHER category")
            }
            ['android.intent.action.VIEW', 'android.intent.category.BROWSABLE'].each { forbidden ->
                if (text.contains(forbidden)) {
                    throw new GradleException("Forbidden deep-link/browser entry found in merged manifest ${manifest}: ${forbidden}")
                }
            }
            if ((text =~ /android:scheme\s*=/).find() || (text =~ /android:host\s*=/).find() || (text =~ /android:autoVerify\s*=/).find()) {
                throw new GradleException("Merged manifest ${manifest} must not contain URL schemes, hosts, app links, or deep links")
            }
        }
    }
}

afterEvaluate {
    tasks.matching { task -> task.name ==~ /process.*MainManifest/ }.configureEach {
        finalizedBy tasks.named('verifyAetherXMergedManifest')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

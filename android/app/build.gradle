apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.localfinal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // applicationId is the on-device package id (independent from Java namespace).
        // Changed so Samsung installs as a fresh app (no signature clash with previous builds).
        applicationId "com.aetherx.livewallpaper"
        setProperty("archivesBaseName", "app-aetherx-livewallpaper")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 260
        versionName "2.6-rawtest"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Force a single universal APK that contains every native ABI.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Explicitly disable ABI/density splits so CI always emits ONE universal APK.
    splits {
        abi { enable false }
        density { enable false }
    }

    // Keep FFmpegKit .so libraries uncompressed and resolve duplicates from transitive deps.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += [
                'lib/armeabi-v7a/libc++_shared.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libc++_shared.so'
            ]
        }
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    buildTypes {
        debug {
            // Debug APK is signed with the Android debug key, installable on any device via `adb install -r`.
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set('app-aetherx-livewallpaper-debug.apk')
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'debug') {
        variant.outputs.all { output ->
            outputFileName = 'app-aetherx-livewallpaper-debug.apk'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"

    implementation files('libs/ffmpeg-kit-min-6.0-2.aar')
    implementation files('libs/smart-exception-java-0.2.1.jar')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyAetherXLiveWallpaperSetup') {
    doLast {
        def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText('UTF-8')
        if (!manifest.contains('com.aetherx.localfinal.wallpaper.AetherXLiveWallpaperService')) {
            throw new GradleException('AetherXLiveWallpaperService must be declared in AndroidManifest.xml')
        }
        if (!manifest.contains('android.permission.BIND_WALLPAPER')) {
            throw new GradleException('Live wallpaper service must be guarded by BIND_WALLPAPER permission')
        }
        if (!manifest.contains('android.service.wallpaper.WallpaperService')) {
            throw new GradleException('Live wallpaper service must declare WallpaperService intent-filter')
        }
        def service = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperService.java")
        def plugin = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperPlugin.java")
        if (!service.exists()) throw new GradleException('Missing AetherXLiveWallpaperService.java')
        if (!plugin.exists()) throw new GradleException('Missing AetherXLiveWallpaperPlugin.java')
    }
}

// After assembleDebug, copy the resulting universal APK to AetherX-installable.apk
// so CI artifact and adb install commands use a single predictable filename.
tasks.register('copyAetherXInstallableDebugApk') {
    doLast {
        def outputDir = file("$buildDir/outputs/apk/debug")
        def sourceApk = file("${outputDir}/app-aetherx-livewallpaper-debug.apk")
        def fallbackApk = file("${outputDir}/app-debug.apk")
        def installable = file("${outputDir}/AetherX-installable.apk")

        def src = sourceApk.exists() ? sourceApk : fallbackApk
        if (!src.exists()) {
            throw new GradleException("No debug APK found in ${outputDir}. Looked for ${sourceApk.name} and ${fallbackApk.name}.")
        }
        outputDir.mkdirs()
        if (!sourceApk.exists()) {
            sourceApk.bytes = src.bytes
        }
        installable.bytes = src.bytes
        if (!installable.exists() || installable.length() == 0) {
            throw new GradleException("Failed to create ${installable}")
        }
        logger.lifecycle("Universal installable APK ready: ${installable} (${installable.length()} bytes)")
    }
}

tasks.register('verifyAetherXInstallableApk') {
    doLast {
        def installable = file("$buildDir/outputs/apk/debug/AetherX-installable.apk")
        if (!installable.exists()) {
            throw new GradleException("AetherX-installable.apk was not generated: ${installable}")
        }
        logger.lifecycle("Verified AetherX-installable.apk: ${installable}")
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLiveWallpaperSetup'
}

afterEvaluate {
    tasks.matching { task -> task.name == 'assembleDebug' }.configureEach {
        finalizedBy tasks.named('copyAetherXInstallableDebugApk')
    }
    tasks.named('verifyAetherXInstallableApk') {
        mustRunAfter tasks.named('copyAetherXInstallableDebugApk')
    }
    tasks.named('copyAetherXInstallableDebugApk') {
        finalizedBy tasks.named('verifyAetherXInstallableApk')
    }
}

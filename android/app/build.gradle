apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.localfinal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aetherx.localfinal"
        setProperty("archivesBaseName", "app-aetherx-localfinal")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 101
        versionName "1.1-live-wallpaper"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set('app-aetherx-localfinal-debug.apk')
        }
    }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'debug') {
        variant.outputs.all { output ->
            outputFileName = 'app-aetherx-localfinal-debug.apk'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Media3 ExoPlayer for live wallpaper video rendering
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    // Media3 Transformer for transcoding to Samsung-compatible H.264/AAC (no FFmpeg)
    implementation "androidx.media3:media3-transformer:1.4.1"
    implementation "androidx.media3:media3-effect:1.4.1"
    implementation "androidx.media3:media3-muxer:1.4.1"


    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyAetherXLiveWallpaperSetup') {
    doLast {
        def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText('UTF-8')
        if (!manifest.contains('com.aetherx.localfinal.wallpaper.AetherXLiveWallpaperService')) {
            throw new GradleException('AetherXLiveWallpaperService must be declared in AndroidManifest.xml')
        }
        if (!manifest.contains('android.permission.BIND_WALLPAPER')) {
            throw new GradleException('Live wallpaper service must be guarded by BIND_WALLPAPER permission')
        }
        if (!manifest.contains('android.service.wallpaper.WallpaperService')) {
            throw new GradleException('Live wallpaper service must declare WallpaperService intent-filter')
        }
        def service = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperService.java")
        def plugin = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperPlugin.java")
        if (!service.exists()) throw new GradleException('Missing AetherXLiveWallpaperService.java')
        if (!plugin.exists()) throw new GradleException('Missing AetherXLiveWallpaperPlugin.java')
    }
}

tasks.register('copyAetherXLocalFinalDebugApk') {
    doLast {
        def outputDir = file("$buildDir/outputs/apk/debug")
        def expected = file("${outputDir}/app-aetherx-localfinal-debug.apk")
        def defaultApk = file("${outputDir}/app-debug.apk")

        if (expected.exists()) {
            logger.lifecycle("AetherX Local Final debug APK already exists: ${expected}")
            return
        }
        if (!defaultApk.exists()) {
            throw new GradleException("Neither ${expected.name} nor ${defaultApk.name} exists in ${outputDir}")
        }
        outputDir.mkdirs()
        expected.bytes = defaultApk.bytes
        if (!expected.exists()) {
            throw new GradleException("Failed to create final debug APK: ${expected}")
        }
        logger.lifecycle("Copied ${defaultApk.name} to ${expected.name}")
    }
}

tasks.register('verifyAetherXFinalDebugApk') {
    doLast {
        def expected = file("$buildDir/outputs/apk/debug/app-aetherx-localfinal-debug.apk")
        if (!expected.exists()) {
            throw new GradleException("Expected debug APK was not generated: ${expected}")
        }
        logger.lifecycle("AetherX Local Final debug APK generated: ${expected}")
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLiveWallpaperSetup'
}

afterEvaluate {
    tasks.matching { task -> task.name == 'assembleDebug' }.configureEach {
        finalizedBy tasks.named('copyAetherXLocalFinalDebugApk')
    }
    tasks.named('verifyAetherXFinalDebugApk') {
        mustRunAfter tasks.named('copyAetherXLocalFinalDebugApk')
    }
    tasks.named('copyAetherXLocalFinalDebugApk') {
        finalizedBy tasks.named('verifyAetherXFinalDebugApk')
    }
}

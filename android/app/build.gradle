apply plugin: 'com.android.application'

android {
    namespace = "com.aetherx.localfinal"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aetherx.livewallpaper"
        setProperty("archivesBaseName", "aetherx")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 200
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("AETHERX_KEYSTORE_PATH") ?: "release.keystore"
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("AETHERX_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("AETHERX_KEY_ALIAS") ?: ""
                keyPassword System.getenv("AETHERX_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksFile = file(System.getenv("AETHERX_KEYSTORE_PATH") ?: "release.keystore")
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Media3 ExoPlayer for live wallpaper video rendering (fallback after MediaPlayer)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyAetherXLiveWallpaperSetup') {
    doLast {
        def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText('UTF-8')
        if (!manifest.contains('com.aetherx.localfinal.wallpaper.AetherXLiveWallpaperService')) {
            throw new GradleException('AetherXLiveWallpaperService must be declared in AndroidManifest.xml')
        }
        if (!manifest.contains('android.permission.BIND_WALLPAPER')) {
            throw new GradleException('Live wallpaper service must be guarded by BIND_WALLPAPER permission')
        }
        if (!manifest.contains('android.service.wallpaper.WallpaperService')) {
            throw new GradleException('Live wallpaper service must declare WallpaperService intent-filter')
        }
        def service = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperService.java")
        def plugin = file("$projectDir/src/main/java/com/aetherx/localfinal/wallpaper/AetherXLiveWallpaperPlugin.java")
        if (!service.exists()) throw new GradleException('Missing AetherXLiveWallpaperService.java')
        if (!plugin.exists()) throw new GradleException('Missing AetherXLiveWallpaperPlugin.java')
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLiveWallpaperSetup'
}

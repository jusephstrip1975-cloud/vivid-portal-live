import java.util.TimeZone

apply plugin: 'com.android.application'

def aetherxVersionCode = 207
def aetherxVersionName = "2.0.7-stable"
def aetherxBuildVersion = System.getenv("AETHERX_BUILD_VERSION") ?: aetherxVersionName
def aetherxBuildTimestamp = System.getenv("AETHERX_BUILD_TIMESTAMP")
if (aetherxBuildTimestamp == null || aetherxBuildTimestamp.isEmpty()) {
    def fmt = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
    fmt.setTimeZone(TimeZone.getTimeZone("UTC"))
    aetherxBuildTimestamp = fmt.format(new Date())
}
def aetherxBuildId = System.getenv("AETHERX_BUILD_ID")
if (aetherxBuildId == null || aetherxBuildId.isEmpty()) {
    def src = (aetherxBuildVersion + "|" + aetherxBuildTimestamp).bytes
    def md = java.security.MessageDigest.getInstance("SHA-256")
    def hex = md.digest(src).encodeHex().toString()
    aetherxBuildId = hex.substring(0, 12)
}

android {
    namespace = "com.aetherx.livewallpaper"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.aetherx.livewallpaper"
        setProperty("archivesBaseName", "AETHERX")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode aetherxVersionCode
        versionName aetherxVersionName
        buildConfigField "String", "AETHERX_BUILD_VERSION", "\"${aetherxBuildVersion}\""
        buildConfigField "String", "AETHERX_BUILD_TIMESTAMP", "\"${aetherxBuildTimestamp}\""
        buildConfigField "String", "AETHERX_BUILD_ID", "\"${aetherxBuildId}\""
        buildConfigField "String", "AETHERX_BUILD_MARKER", "\"NEW_BUILD_LOADED_OK\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("AETHERX_KEYSTORE_PATH") ?: "release.keystore"
            storeFile file(ksPath)
            storePassword System.getenv("AETHERX_KEYSTORE_PASSWORD") ?: "aetherx-internal-test"
            keyAlias System.getenv("AETHERX_KEY_ALIAS") ?: "aetherx-test"
            keyPassword System.getenv("AETHERX_KEY_PASSWORD") ?: "aetherx-internal-test"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Media3 ExoPlayer for live wallpaper video rendering (fallback after MediaPlayer)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('verifyAetherXLiveWallpaperSetup') {
    doLast {
        def manifest = file("$projectDir/src/main/AndroidManifest.xml").getText('UTF-8')
        if (!manifest.contains('com.aetherx.livewallpaper.wallpaper.AetherXLiveWallpaperService')) {
            throw new GradleException('AetherXLiveWallpaperService must be declared in AndroidManifest.xml')
        }
        if (!manifest.contains('android.permission.BIND_WALLPAPER')) {
            throw new GradleException('Live wallpaper service must be guarded by BIND_WALLPAPER permission')
        }
        if (!manifest.contains('android.service.wallpaper.WallpaperService')) {
            throw new GradleException('Live wallpaper service must declare WallpaperService intent-filter')
        }
        def service = file("$projectDir/src/main/java/com/aetherx/livewallpaper/wallpaper/AetherXLiveWallpaperService.java")
        def plugin = file("$projectDir/src/main/java/com/aetherx/livewallpaper/wallpaper/AetherXLiveWallpaperPlugin.java")
        if (!service.exists()) throw new GradleException('Missing AetherXLiveWallpaperService.java')
        if (!plugin.exists()) throw new GradleException('Missing AetherXLiveWallpaperPlugin.java')
    }
}

// STRICT: never auto-generate a keystore. A stable signature is the only way Play Protect stops complaining.
tasks.register('requireAetherXKeystore') {
    doLast {
        def ksPath = System.getenv("AETHERX_KEYSTORE_PATH") ?: "release.keystore"
        def ksFile = file(ksPath)
        if (!ksFile.exists() || ksFile.length() == 0L) {
            throw new GradleException(
                "AETHERX release keystore missing at ${ksFile.absolutePath}. " +
                "Commit android/app/release.keystore or set AETHERX_KEYSTORE_PATH. " +
                "NEVER regenerate it — Play Protect blocks new signatures."
            )
        }
        logger.lifecycle("AETHERX signing keystore OK: ${ksFile.absolutePath} (${ksFile.length()} bytes)")
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyAetherXLiveWallpaperSetup'
}

gradle.projectsEvaluated {
    tasks.matching { it.name in ['assembleRelease', 'bundleRelease', 'assembleDebug'] }.configureEach {
        dependsOn 'requireAetherXKeystore'
    }
}

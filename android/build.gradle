// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.register('cleanBuildCache') {
    group = 'build'
    description = 'AETHERX compatibility purge for stale Android build outputs; AGP cleanBuildCache was removed upstream.'
    doLast {
        delete rootProject.layout.buildDirectory
        delete project(':app').layout.buildDirectory
        println 'AETHERX cleanBuildCache compatibility purge completed (AGP build cache task no longer exists).'
    }
}

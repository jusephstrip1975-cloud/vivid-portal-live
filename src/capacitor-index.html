<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#02040a" />
    <title>AetherX</title>
  </head>
  <body>
    <div id="root">
      <main class="aetherx-native-fallback" aria-label="AetherX iniciando">
        <div>
          <strong>AetherX</strong>
          <span>Iniciando app local…</span>
        </div>
      </main>
    </div>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #02040a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .aetherx-native-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(14, 165, 233, 0.24), transparent 38%),
          radial-gradient(circle at 80% 85%, rgba(139, 92, 246, 0.22), transparent 42%),
          #02040a;
      }
      .aetherx-native-fallback div {
        display: grid;
        gap: 10px;
        text-align: center;
      }
      .aetherx-native-fallback strong {
        font-size: 28px;
        letter-spacing: 0.08em;
      }
      .aetherx-native-fallback span {
        color: rgba(248, 250, 252, 0.62);
        font-size: 13px;
      }
    </style>
    <script>
      console.info(
        "[AetherX Android] Booting SPA from packaged Capacitor local assets",
        location.href,
      );
      window.addEventListener("DOMContentLoaded", function () {
        console.info("[AetherX Android] DOMContentLoaded", location.href);
      });
    </script>
    <script type="module" src="/src/capacitor-client.tsx"></script>
  </body>
</html>

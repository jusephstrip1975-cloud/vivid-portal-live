<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#02040a" />
    <meta name="aetherx-build-version" content="__AETHERX_BUILD_VERSION__" />
    <title>AetherX</title>
  </head>
  <body>
    <div id="root">
      <main class="aetherx-native-fallback" aria-label="AetherX iniciando">
        <div>
          <strong>AETHERX BUILD __AETHERX_BUILD_VERSION__</strong>
          <strong>AetherX</strong>
          <span>AetherX cargando local</span>
          <pre id="aetherx-boot-error" hidden></pre>
        </div>
      </main>
    </div>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #02040a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .aetherx-native-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(14, 165, 233, 0.24), transparent 38%),
          radial-gradient(circle at 80% 85%, rgba(139, 92, 246, 0.22), transparent 42%),
          #02040a;
      }
      .aetherx-native-fallback div {
        display: grid;
        gap: 10px;
        text-align: center;
      }
      .aetherx-native-fallback strong {
        font-size: 28px;
        letter-spacing: 0.08em;
      }
      .aetherx-native-fallback strong:first-child {
        font-size: 18px;
        color: #67e8f9;
      }
      .aetherx-native-fallback span {
        color: rgba(248, 250, 252, 0.62);
        font-size: 13px;
      }
      #aetherx-boot-error {
        box-sizing: border-box;
        max-width: min(88vw, 520px);
        margin: 10px 0 0;
        padding: 14px;
        border: 1px solid rgba(239, 68, 68, 0.55);
        border-radius: 14px;
        background: rgba(127, 29, 29, 0.28);
        color: #fecaca;
        white-space: pre-wrap;
        text-align: left;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
    <script>
      (function () {
        function showBootError(kind, value, source, line, column) {
          var node = document.getElementById("aetherx-boot-error");
          if (!node) return;
          var message = value && value.stack ? value.stack : value && value.message ? value.message : String(value || "Error desconocido");
          node.hidden = false;
          node.textContent = kind + "\n" + message + (source ? "\n" + source + ":" + line + ":" + column : "");
          document.documentElement.dataset.aetherxBootError = "true";
        }
        window.__aetherxShowBootError = showBootError;
        window.onerror = function (message, source, line, column, error) {
          console.error("[AetherX Android] window.onerror", message, source, line, column, error);
          showBootError("window.onerror", error || message, source, line, column);
          return false;
        };
        window.onunhandledrejection = function (event) {
          console.error("[AetherX Android] onunhandledrejection", event && event.reason);
          showBootError("unhandledrejection", event && event.reason);
        };
      })();
      console.info(
        "[AetherX Android] APP_BUILD_VERSION=__AETHERX_BUILD_VERSION__ NEW_BUILD_LOADED_OK Booting SPA from packaged Capacitor local assets",
        location.pathname + location.search + location.hash,
      );
      window.addEventListener("DOMContentLoaded", function () {
        console.info("[AetherX Android] APP_BUILD_VERSION=__AETHERX_BUILD_VERSION__ NEW_BUILD_LOADED_OK DOMContentLoaded", location.pathname + location.search + location.hash);
      });
    </script>
    <script type="module" src="/src/capacitor-client.tsx"></script>
  </body>
</html>

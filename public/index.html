<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AetherX</title>
    <meta name="theme-color" content="#02040a" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #02040a;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        background:
          radial-gradient(
            ellipse at top,
            rgba(59, 130, 246, 0.18),
            transparent 60%
          ),
          radial-gradient(
            ellipse at bottom,
            rgba(139, 92, 246, 0.18),
            transparent 60%
          ),
          #02040a;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-style: italic;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
        font-weight: 700;
      }
      p {
        max-width: 320px;
        font-size: 13px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.65);
        margin: 0 0 22px;
      }
      button {
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: 0 12px 40px rgba(59, 130, 246, 0.35);
      }
      .hint {
        margin-top: 18px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">AetherX</div>
      <h1>Sin conexión</h1>
      <p>
        AetherX necesita internet para cargar los live wallpapers. Comprueba tu
        conexión y vuelve a intentarlo.
      </p>
      <button onclick="location.reload()">Reintentar</button>
      <div class="hint">Live wallpapers · Premium 4K</div>
    </div>
  </body>
</html>
